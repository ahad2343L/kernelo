[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelo"
version = "0.1.0"
description = "A terminal chat UI in the style of Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kernelo = "kernelo.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kernelo*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
